name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --all-groups

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      # The suite installs nothing and reaches no network: everything under test is the
      # code that decides what counts as a change.
      - name: Test
        run: uv run pytest -q
