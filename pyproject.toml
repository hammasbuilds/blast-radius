[project]
name = "blast-radius"
version = "0.1.0"
description = "What a dependency upgrade actually changes - including the changes nothing warns you about"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    # Listed one by one so PyPI can show what is supported. Every version
    # here is exercised by CI on Linux and Windows.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["dependency", "upgrade", "semver", "api-diff", "differential-testing", "breaking-change"]
# No runtime dependencies. Installing the two versions uses whichever of uv or pip is
# already on the machine, and everything else is stdlib.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
blast-radius = "blast_radius.cli:main"

[project.urls]
Homepage = "https://github.com/hammasbuilds/blast-radius"
Source = "https://github.com/hammasbuilds/blast-radius"
Issues = "https://github.com/hammasbuilds/blast-radius/issues"
Changelog = "https://github.com/hammasbuilds/blast-radius/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blast_radius"]
# py.typed is empty and has no extension, which is exactly the sort of file
# a build backend drops. Without it in the wheel, mypy and pyright ignore
# every annotation in this package and hand callers `Any` - PEP 561 needs
# the marker shipped, not just the hints written.
artifacts = ["src/blast_radius/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
